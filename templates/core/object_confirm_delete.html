{% extends 'app_base.html' %}

{% block title %}Excluir · Vitalis{% endblock %}

{% block content %}
<section class="pt-32 lg:pt-40 pb-24">
    <div class="max-w-xl mx-auto px-6 md:px-12">
        <span class="text-sm font-medium tracking-widest uppercase text-[#5d674f] block mb-4">Excluir</span>
        <h1 class="text-4xl tracking-tight font-medium text-[#1a1a1a] leading-[1.1] mb-6">
            Excluir "{{ object }}"?
        </h1>
        <p class="text-lg text-[#5c5c5a] mb-4">Esta ação não pode ser desfeita.</p>
        {% if delete_warning %}
        <div class="bg-[#f2ece5] rounded-[1.5rem] px-6 py-4 mb-8 flex items-start gap-3">
            <i data-lucide="alert-triangle" class="w-5 h-5 stroke-[1.5] shrink-0 mt-0.5 text-[#5d674f]"></i>
            <p class="text-base text-[#1a1a1a]">{{ delete_warning }}</p>
        </div>
        {% else %}
        <div class="mb-8"></div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="flex items-center gap-4">
                <button type="submit" class="inline-flex bg-[#1a1a1a] text-white px-8 py-5 rounded-full items-center gap-3 hover:bg-[#333] transition-colors">
                    <span class="text-base font-normal tracking-wide">Excluir</span>
                    <i data-lucide="trash-2" class="w-5 h-5 stroke-[1.5]"></i>
                </button>
                <a href="{% if object.get_absolute_url %}{{ object.get_absolute_url }}{% else %}javascript:history.back(){% endif %}" class="text-base text-[#5c5c5a] hover:text-[#1a1a1a] transition-colors">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
